name: accessible-license-dev

services:
  keygate:
    image: accessible-keygate-dev:local
    build:
      context: .
      args:
        VERSION: accessible-dev
    ports:
      - "127.0.0.1:9100:9000"
    env_file: .env.development
    environment:
      KEYGATE_UPDATE_REPO: WOLFIEEEE/keygate
      PORT: "9000"
      ENVIRONMENT: development
      BASE_URL: http://host.docker.internal:9100
      DATABASE_URL: postgres://keygate:keygate_dev_only@postgres:5432/keygate?sslmode=disable
      # Real billing stays disabled until test credentials are explicitly supplied.
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
      STRIPE_LIVEMODE: "false"
      SMTP_HOST: ""
      REDIS_URL: ""
      STORAGE_LOCAL_PATH: /data/artifacts
      BOOTSTRAP_OWNER_EMAIL: owner@accessible.test
      BOOTSTRAP_OWNER_NAME: Local owner
      BOOTSTRAP_PRODUCT_SLUG: accessible-forms-pro
      BOOTSTRAP_PLANS_JSON: '[]'
    volumes:
      - dev-artifacts:/data/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: keygate
      POSTGRES_PASSWORD: keygate_dev_only
      POSTGRES_DB: keygate
    volumes:
      - dev-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keygate -d keygate"]
      interval: 3s
      timeout: 3s
      retries: 20

  postgres-test:
    image: postgres:18-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: keygate
      POSTGRES_PASSWORD: keygate_test_only
      POSTGRES_DB: keygate_test
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keygate -d keygate_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  test:
    image: golang:1.27-alpine
    profiles: [test]
    working_dir: /app
    volumes:
      - .:/app:ro
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
    environment:
      TEST_DATABASE_URL: postgres://keygate:keygate_test_only@postgres-test:5432/keygate_test?sslmode=disable
    depends_on:
      postgres-test:
        condition: service_healthy
    # Packages share a database; serial execution avoids settings-test conflicts.
    command: ["go", "test", "-p", "1", "-count=1", "./..."]

volumes:
  dev-postgres:
  dev-artifacts:
  go-mod:
    name: accessible-keygate-go-mod
  go-build:
    name: accessible-keygate-go-build
